<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer World</title>
<style>
  :root{
    --pink:#ff5fa8; --pink-d:#d63384; --pink-soft:#ffe6f1; --lilac:#efe6ff;
    --ink:#4b2a63; --muted:#8a6f9e; --card:#ffffff; --line:#f4cfe3; --space:#1a1036;
    --line2:#ffc2df; --light:#ff8fc7; --g1:#ff7ab8; --g2:#ff4f9a; --mic1:#9b5de5; --bg1:#fff2f8; --bg2:#f0e8ff; --dotoff:#d9c8f0; --bt:#ff5fa8; --rgb:255,79,154;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    display:flex; flex-direction:column; height:100vh; -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit; cursor:pointer}

  /* ---------- top bar ---------- */
  header.top{display:flex; align-items:center; gap:14px; padding:12px 18px 6px; flex-wrap:wrap}
  .bigbtn{
    border:none; border-radius:40px; height:64px; padding:0 24px; font-size:20px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,var(--g1),var(--g2)); box-shadow:0 6px 16px rgba(var(--rgb),.35);
    display:inline-flex; align-items:center; gap:10px; transition:transform .12s;
  }
  .bigbtn[hidden]{display:none}
  .bigbtn:active{transform:scale(.94)}
  .bigbtn .e{font-size:28px; line-height:1}
  .bigbtn.mic{width:64px; padding:0; justify-content:center; background:linear-gradient(135deg,var(--mic1),var(--g2))}
  .bigbtn.mic svg{width:30px; height:30px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
  .bigbtn.mic.on{animation:pulse 1.1s infinite}
  .bigbtn.mic.shake{animation:shake .4s}
  .row1{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:1 1 100%; width:100%}
  .brand{display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; min-width:0; flex:1 1 0; overflow:hidden}
  .brand .bu{font-size:46px; line-height:1}
  .brand .bt{font-size:25px; font-weight:800; line-height:1.05; color:var(--bt)}
  .homebtn{width:60px; height:60px; border-radius:50%; background:#fff; border:3px solid var(--line2); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(var(--rgb),.22); flex:0 0 auto}
  .homebtn svg{width:30px; height:30px; stroke:var(--pink); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
  .homebtn:active{transform:scale(.94)}
  .northbtn{position:absolute; top:12px; right:12px; width:48px; height:48px; border-radius:50%; border:2px solid rgba(255,255,255,.55);
    background:rgba(40,20,80,.55); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; z-index:6; cursor:pointer}
  .northbtn svg{width:30px; height:30px}
  .northbtn:active{transform:scale(.92)}
  .flagbtn{
    width:84px; height:60px; border-radius:12px; border:3px dashed var(--light); background:#fff; padding:0; position:relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(var(--rgb),.3); animation:wiggle 3.2s ease-in-out infinite; transition:transform .12s;
  }
  .flagbtn:active{transform:scale(.94)}
  .flagbtn svg{width:46px; height:46px; display:block; transition:transform 1s cubic-bezier(.15,.7,.2,1)}
  .flagbtn .wptr{position:absolute; top:-3px; left:50%; margin-left:-6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:11px solid var(--pink-d); filter:drop-shadow(0 1px 0 #fff)}
  .flagbtn.spinning{animation:none}
  @keyframes wiggle{0%,86%,100%{transform:rotate(0)} 90%{transform:rotate(-5deg)} 94%{transform:rotate(5deg)} 98%{transform:rotate(-3deg)}}
  .bigbtn.speak{width:64px; padding:0; justify-content:center; font-size:28px; margin-left:auto; flex:0 0 auto}
  .bigbtn.speak.talking{animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--rgb),.55)} 100%{box-shadow:0 0 0 18px rgba(var(--rgb),0)}}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}

  .search{position:relative; margin-left:auto; width:min(280px,100%)}
  .search input{
    width:100%; padding:10px 14px; font:inherit; font-size:15px; color:var(--ink);
    border:2px solid var(--line); border-radius:14px; background:#fff; outline:none;
  }
  .search input:focus{border-color:var(--pink)}
  .list{
    position:absolute; top:calc(100% + 6px); right:0; left:0; max-height:340px; overflow:auto; z-index:30;
    background:#fff; border:2px solid var(--line); border-radius:14px; padding:6px; display:none;
    box-shadow:0 14px 34px rgba(75,42,99,.18);
  }
  .list.open{display:block}
  .opt{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; cursor:pointer}
  .opt.active,.opt:hover{background:var(--pink-soft)}
  .oflag{width:30px; height:20px; object-fit:contain; border-radius:3px; box-shadow:0 0 0 1px var(--line)}
  .none{padding:10px 12px; color:var(--muted)}

  /* ---------- flag shelf ---------- */
  .shelf-wrap{position:relative; padding:0 10px}
  .shelf{
    position:relative; display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity;
    padding:8px 46px 12px; scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
  }
  .tile{
    flex:0 0 auto; scroll-snap-align:center; border:3px solid transparent; background:#fff; border-radius:16px; padding:6px;
    box-shadow:0 3px 10px rgba(var(--rgb),.18); transition:transform .12s, border-color .12s;
  }
  .tile img{display:block; width:84px; height:56px; object-fit:contain; border-radius:6px}
  .tile:active{transform:scale(.94)}
  .tile{opacity:.62; transition:transform .12s, border-color .12s, opacity .2s, translate .5s cubic-bezier(.2,.8,.2,1)}
  .tile:active{opacity:1}
  .tile.on{border-color:var(--pink); transform:translateY(-3px); opacity:1}
  .tile.fresh{animation:tilein .45s ease-out}
  @keyframes tilein{from{opacity:0; transform:scale(.5)} to{opacity:.62; transform:scale(1)}}
  .shelf-arrow{
    position:absolute; top:calc(50% - 4px); transform:translateY(-50%); z-index:3; width:40px; height:40px; border-radius:50%;
    border:none; background:#fff; color:var(--pink-d); font-size:24px; line-height:1; box-shadow:0 3px 10px rgba(var(--rgb),.3);
  }
  .shelf-arrow.l{left:8px} .shelf-arrow.r{right:8px}

  /* ---------- main ---------- */
  main{
    flex:1; min-height:0; display:grid; gap:16px; padding:8px 16px 16px;
    grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);
  }
  .card{background:var(--card); border:2px solid var(--line); border-radius:22px}
  .globe-card{aspect-ratio:1/1; width:100%; max-height:100%; align-self:center; position:relative; overflow:hidden; background:var(--space); min-height:0; border-color:var(--space)}
  #globe{position:absolute; inset:0; width:100%; height:100%; display:block}
  .globe-note{position:absolute; left:14px; bottom:10px; color:rgba(255,255,255,.5); font-size:11.5px; pointer-events:none}
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center;
    color:#e8dcff; background:var(--space); z-index:5; text-align:center; padding:20px; transition:opacity .4s; font-size:18px;
  }
  .overlay.hide{opacity:0; pointer-events:none}
  .spinner{width:34px; height:34px; border-radius:50%; border:4px solid rgba(255,255,255,.2); border-top-color:var(--light); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .listen{
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6; background:#fff; color:var(--ink);
    border-radius:999px; padding:9px 18px; display:flex; gap:12px; align-items:center; font-weight:800;
  }
  .listen[hidden]{display:none}
  .bars{display:flex; gap:4px; align-items:center; height:22px}
  .bars i{width:5px; height:8px; border-radius:3px; background:var(--pink); animation:bar .7s ease-in-out infinite alternate}
  .bars i:nth-child(2){animation-delay:.15s} .bars i:nth-child(3){animation-delay:.3s} .bars i:nth-child(4){animation-delay:.45s}
  @keyframes bar{from{height:6px} to{height:22px}}

  /* unicorn */
  .plane{
    position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px 0 0 -42px; pointer-events:none;
    opacity:0; transform:scale(.4); z-index:4; transition:opacity .25s ease, transform .25s ease;
    filter:drop-shadow(0 6px 10px rgba(var(--rgb),.6));
  }
  .plane.show{opacity:1; transform:scale(1)}
  .plane .rot{position:relative; width:100%; height:100%}
  .uni{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:64px; line-height:1; animation:bob .7s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(-5px) rotate(-4deg)} to{transform:translateY(5px) rotate(4deg)}}
  .sp{position:absolute; font-size:20px; animation:twinkle 1s ease-in-out infinite alternate}
  .sp.s1{left:-8px; top:4px} .sp.s2{right:-6px; top:-8px; animation-delay:.3s} .sp.s3{left:6px; bottom:-8px; animation-delay:.6s}
  @keyframes twinkle{from{opacity:.3; transform:scale(.7)} to{opacity:1; transform:scale(1.15)}}
  .bp{position:absolute; left:50%; top:50%; font-size:28px; pointer-events:none; z-index:6; animation:bp 1.2s ease-out forwards}
  @keyframes bp{0%{transform:translate(-50%,-50%) scale(.3); opacity:1} 100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2); opacity:0}}

  /* ---------- country card ---------- */
  .side{display:flex; flex-direction:column; gap:16px; min-height:0; min-width:0}
  .info{padding:16px 20px; flex:0 0 auto}
  .empty{display:flex; align-items:center; gap:16px; color:var(--muted); font-size:16px}
  .empty .bigemoji{font-size:54px; animation:bob 1s ease-in-out infinite alternate}
  .kc-head{display:flex; align-items:center; gap:18px}
  .kc-namerow{display:flex; align-items:center; gap:10px; min-width:0}
  .kc-flag-sm{height:30px; width:auto; flex:0 0 auto; border-radius:5px; box-shadow:0 0 0 1.5px var(--line); background:#fff}
  .kc-name{font-size:30px; font-weight:800; line-height:1.15; white-space:nowrap; display:block; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; border:none; background:none; color:var(--ink); text-align:left; padding:0}
  .size{display:flex; align-items:center; gap:10px; margin-top:8px; border:none; background:var(--lilac); border-radius:999px; padding:6px 14px 6px 12px; color:var(--ink); font-size:16px}
  .dots{display:flex; align-items:flex-end; gap:4px}
  .dots i{display:block; border-radius:50%; background:var(--dotoff)}
  .dots i:nth-child(1){width:9px; height:9px} .dots i:nth-child(2){width:13px; height:13px}
  .dots i:nth-child(3){width:18px; height:18px} .dots i:nth-child(4){width:24px; height:24px}
  .dots i.on{background:var(--pink)}
  .kc-actions{margin-top:14px}
  .fact{margin-top:12px; font-size:22px; line-height:1.38; background:var(--pink-soft); border-radius:18px; padding:14px 18px}
  .fact[hidden]{display:none}

  .kc-mid{min-width:0; flex:1 1 auto}
  .kc-name::-webkit-scrollbar{display:none}
  .facts{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin-top:14px; padding-bottom:4px; scrollbar-width:none}
  .facts::-webkit-scrollbar{display:none}
  .factcard{
    flex:0 0 84%; scroll-snap-align:start; background:var(--pink-soft); border-radius:14px; padding:10px 14px;
    font-size:19px; line-height:1.34; min-height:84px; display:flex; align-items:center; position:relative; cursor:pointer;
    -webkit-tap-highlight-color:transparent; box-shadow:inset 0 0 0 0 var(--pink);
  }
  .factcard.talking{animation:glow 1s ease-in-out infinite alternate}
  .factcard.hint{animation:hintpulse 1.3s ease-in-out infinite}
  .factcard.hint::after{content:'👆'; position:absolute; right:10px; bottom:4px; font-size:20px; animation:tapbob .65s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:inset 0 0 0 2px rgba(var(--rgb),.5)} to{box-shadow:inset 0 0 0 3px var(--pink)}}
  @keyframes hintpulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(var(--rgb),0)} 50%{box-shadow:inset 0 0 0 3px rgba(var(--rgb),.7)}}
  @keyframes tapbob{from{transform:translateY(0)} to{transform:translateY(-4px)}}
  .fdots{display:flex; justify-content:center; gap:7px; margin-top:8px}
  .fdots i{width:9px; height:9px; border-radius:50%; background:var(--line)}
  .fdots i.on{background:var(--pink)}

  /* ---------- pictures ---------- */
  .gallery{flex:1; min-height:0; display:flex; flex-direction:column; padding:14px; gap:10px}
  .viewer{position:relative; flex:1; min-height:180px; border-radius:16px; overflow:hidden; background:#f6eefb}
  .viewer img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block}
  .viewer .msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px; font-size:17px}
  .nav{
    position:absolute; top:50%; transform:translateY(-50%); width:54px; height:54px; border-radius:50%; border:none;
    background:rgba(255,255,255,.94); color:var(--pink-d); font-size:32px; line-height:1; box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .nav.prev{left:10px} .nav.next{right:10px}
  .count{position:absolute; right:10px; top:10px; background:rgba(75,42,99,.75); color:#fff; font-size:13px; padding:3px 10px; border-radius:999px}
  .vbtn{
    position:absolute; bottom:10px; width:46px; height:46px; border-radius:50%; border:none; font-size:22px; line-height:1;
    background:rgba(255,255,255,.94); box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .vbtn[hidden], .nav[hidden], .count[hidden]{display:none}
  .vbtn.say{left:10px} .vbtn.play{right:10px}
  .cap{display:flex; justify-content:space-between; gap:12px; font-size:15px; min-height:20px; font-weight:700}
  .cap #capText{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cap a{color:var(--pink-d); text-decoration:none; white-space:nowrap; font-weight:600; font-size:13px}
  .thumbs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scroll-behavior:smooth}
  .thumbs button{flex:0 0 auto; width:92px; height:62px; padding:0; border:3px solid transparent; border-radius:12px; overflow:hidden; background:#f6eefb; opacity:.8}
  .thumbs button.on{border-color:var(--pink); opacity:1}
  .thumbs img{width:100%; height:100%; object-fit:cover; display:block}
  #main{cursor:zoom-in}

  /* ---------- overlays ---------- */
  .lb{position:fixed; inset:0; z-index:100; background:rgba(30,12,50,.92); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:100%; max-height:calc(100vh - 110px); object-fit:contain; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lb .lbcap{color:#fbeaff; font-size:18px; font-weight:700; text-align:center; max-width:900px}
  .lb button{position:absolute; border:none; background:rgba(255,255,255,.18); color:#fff; border-radius:50%; width:56px; height:56px; font-size:32px; line-height:1}
  .lb button:hover{background:rgba(255,255,255,.3)}
  .lb .lbx{top:16px; right:16px} .lb .lbp{left:16px; top:50%} .lb .lbn{right:16px; top:50%}

  .choices{position:fixed; inset:0; z-index:90; background:rgba(40,16,70,.55); display:flex; align-items:center; justify-content:center; padding:16px}
  .choices[hidden]{display:none}
  .choices .box{position:relative; background:#fff; border-radius:28px; padding:26px 22px 22px; max-width:96vw}
  .choices .row{display:flex; gap:18px; flex-wrap:wrap; justify-content:center}
  .choice{border:3px solid var(--line); background:#fff; border-radius:20px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:18px; font-weight:800; color:var(--ink)}
  .choice:hover,.choice:active{border-color:var(--pink); background:var(--pink-soft)}
  .choice img{width:150px; height:100px; object-fit:contain}
  .choices .x{position:absolute; top:6px; right:10px; border:none; background:none; font-size:30px; color:var(--muted)}

  .toast{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; max-width:min(560px,92vw); font-size:14px; line-height:1.4; z-index:95}
  .toast[hidden]{display:none}

  @media (max-width:900px){
    body{height:auto; min-height:100vh}
    .search{margin-left:0; width:100%}
    main{display:block; padding:8px 12px 14px}
    .globe-card{height:auto; width:auto; max-height:none; min-height:0; margin:0 26px 12px}
    .side{gap:12px}
    .viewer{min-height:240px; flex:none; aspect-ratio:16/10}
    .kc-name{font-size:25px}
  }
  @media (max-width:480px){
    .brand .bu{font-size:38px}
    .brand .bt{font-size:20px}
    .homebtn{width:50px; height:50px}
    .homebtn svg{width:26px; height:26px}
    .row1{gap:6px}
    .bigbtn.mic{width:54px; height:54px}
    .bigbtn.mic svg{width:26px; height:26px}
    .flagbtn{width:72px; height:52px}
    .flagbtn svg{width:40px; height:40px}
    .bigbtn.speak{width:56px; height:56px}
    .kc-flag{height:64px; max-width:100px}
    .kc-name{font-size:23px}
    .factcard{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important} }
</style>
<script>
/* ---- who is this page for? (settings come from the link made by index.html) ---- */
(function () {
  var hex = function (h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); };
  var toHex = function (a) { return '#' + a.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); };
  var mix = function (a, b, t) { var x = hex(a), y = hex(b); return toHex(x.map(function (v, i) { return v * (1 - t) + y[i] * t; })); };
  var W = '#ffffff', K = '#000000';
  var THEMES = {
    unicorn:  { c:'#ff5fa8', d:'#d63384', ink:'#4b2a63', space:'#1a1036', logo:'🦄', traveller:'🦄', sparkles:['✨','💖','⭐','🌸'],
                soft:'#ffe6f1', lilac:'#efe6ff', line:'#f4cfe3', line2:'#ffc2df', light:'#ff8fc7', g1:'#ff7ab8', g2:'#ff4f9a', mic1:'#9b5de5',
                bg1:'#fff2f8', bg2:'#f0e8ff', muted:'#8a6f9e', dotoff:'#d9c8f0', fill:'#ff7eb6', stroke:'#8a1c55', bt:'#ff5fa8' },
    animals:  { c:'#2fa44f', d:'#1f7a39', ink:'#1f4030', space:'#0e2a1c', logo:'🦁', traveller:'🦜', sparkles:['🐾','🍃','⭐','🌿'] },
    vehicles: { c:'#2f8fe0', d:'#1d62a3', ink:'#1b3a5c', space:'#0c1d36', logo:'🚗', traveller:'✈️', sparkles:['💨','⭐','☁️','✨'] },
    flowers:  { c:'#e69a0a', d:'#b87400', ink:'#5b3a08', space:'#2b1d12', logo:'🌻', traveller:'🐝', sparkles:['🌸','🌼','🌷','✨'], g1:'#f0a30a', g2:'#c47a00' },
    space:    { c:'#6a5de8', d:'#4538b5', ink:'#2a2366', space:'#0b0a2a', logo:'🪐', traveller:'🚀', sparkles:['⭐','✨','🌟','💫'] },
    ocean:    { c:'#12a8a3', d:'#0b7f7b', ink:'#0f4a4d', space:'#04212a', logo:'🐠', traveller:'🐬', sparkles:['💧','🐚','✨','🌊'] }
  };
  Object.keys(THEMES).forEach(function (k) {                // fill in the shades each theme did not spell out
    var t = THEMES[k], d = function (key, v) { if (!t[key]) t[key] = v; };
    d('soft', mix(t.c, W, .88)); d('lilac', mix(t.c, W, .84)); d('line', mix(t.c, W, .75)); d('line2', mix(t.c, W, .6));
    d('light', mix(t.c, W, .35)); d('g1', mix(t.c, W, .2)); d('g2', t.c); d('mic1', t.d);
    d('bg1', mix(t.c, W, .94)); d('bg2', mix(t.d, W, .93)); d('muted', mix(t.ink, W, .45)); d('dotoff', mix(t.c, W, .6));
    d('fill', mix(t.c, W, .1)); d('stroke', mix(t.d, K, .4)); d('bt', t.d);
  });
  var cleanName = function (v) { v = v.replace(/[^\p{L}\p{M} '’-]/gu, '').replace(/\s+/g, ' ').replace(/^\s+/, ''); return Array.from(v).slice(0, 12).join(''); };
  var q = new URLSearchParams(location.search);
  var name = cleanName(q.get('name') || '').trim() || 'Gaia';
  var tid = THEMES[q.get('theme')] ? q.get('theme') : 'animals';
  var fav = [];
  (q.get('fav') || '').split(',').forEach(function (s) { s = s.trim().toUpperCase(); if (/^[A-Z]{2}$/.test(s) && fav.indexOf(s) < 0) fav.push(s); });

function loadScript(urls) {
  return new Promise((resolve, reject) => {
    let i = 0;
    (function next() {
      if (i >= urls.length) return reject(new Error('WorldWind could not be loaded'));
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = () => (window.WorldWind ? resolve() : next());
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
}
async function fetchGeo() {
  for (const u of GEO_URLS) {
    try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) { /* try next */ }
  }
  throw new Error('Country boundary data could not be loaded');
}
function wbFetch(ind) {

    .then(r => r.json())

}

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const D = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const toVec = (lat, lon) => [Math.cos(lat*D)*Math.cos(lon*D), Math.cos(lat*D)*Math.sin(lon*D), Math.sin(lat*D)];
const fromVec = v => ({ lat: Math.asin(clamp(v[2], -1, 1)) / D, lon: Math.atan2(v[1], v[0]) / D });
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
function slerp(a, b, t, omega) {
  if (omega < 1e-9) return a;
  const s = Math.sin(omega), A = Math.sin((1-t)*omega)/s, B = Math.sin(t*omega)/s;
  return [A*a[0]+B*b[0], A*a[1]+B*b[1], A*a[2]+B*b[2]];
}
function bearing(a, b) {
  const p1 = a.lat*D, p2 = b.lat*D, dl = (b.lon - a.lon)*D;
  return Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl)) / D;
}
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

function fmtPop(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2) + ' billion';
  if (n >= 1e6) return (n/1e6).toFixed(n >= 1e7 ? 1 : 2) + ' million';
  return Math.round(n).toLocaleString('en-US');
}
function fmtMoney(n) {
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + ' trillion';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(n >= 1e11 ? 0 : 1) + ' billion';
  return '$' + Math.round(n/1e6).toLocaleString('en-US') + ' million';
}

const state = { wwd:null, base:null, hi:null, feats:[], countries:{}, sel:0, current:null, cur:null, wb:Promise.resolve({pop:{},gdp:{}}) };
let WW, GREY, SELECTED, POLITICAL;

const PALETTE = ['#f2b3b3','#f7d3a1','#f4eca6','#bfe3ac','#a6dad3','#adc9f0','#cdbcec','#efbad9'];

function isoOf(P) {
  let a = P.ISO_A2_EH;
  if (!a || a === '-99') a = P.ISO_A2;
  if (!a || a === '-99') a = (P.ADM0_A3 === 'KOS') ? 'XK' : null;
  return a;
}
function hashIdx(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h % PALETTE.length; }

function ringInfo(ring) {
  let a = 0, minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    a += ring[j][0]*ring[i][1] - ring[i][0]*ring[j][1];
    const lon = ring[i][0], lat = ring[i][1];
    if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
    if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
  }
  const midLat = (minLat + maxLat) / 2;
  return { area: Math.abs(a/2) * Math.cos(midLat*D), minLat, maxLat, minLon, maxLon };
}

function buildFeatures(geo) {
  const feats = [];
  for (const f of geo.features) {
    const P = {}; for (const k in f.properties) P[k.toUpperCase()] = f.properties[k];
    if (P.ADM0_A3 === 'ATA' || P.ISO_A2 === 'AQ' || !f.geometry) continue;
    const g = f.geometry;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    if (!polys.length) continue;
    const infos = polys.map(p => ringInfo(p[0]));
    const maxArea = Math.max(...infos.map(i => i.area));
    const iso = isoOf(P);
    const feat = {
      P, iso: (iso && COUNTRIES[iso]) ? iso : null,
      colorIdx: hashIdx(P.ADM0_A3 || P.NAME || ''),
      area: infos.reduce((s, i) => s + i.area, 0),
      shapes: [], bounds: [], infos: [], maxArea
    };
    polys.forEach((poly, i) => {
      if (infos[i].area < 0.004 && infos[i].area < maxArea) return;     // skip specks
      const rings = poly.map(r => {
        const pts = r.map(c => new WW.Location(c[1], c[0]));
        const f0 = r[0], l0 = r[r.length-1];
        if (r.length > 3 && f0[0] === l0[0] && f0[1] === l0[1]) pts.pop();
        return pts;
      });
      feat.bounds.push(rings.length === 1 ? rings[0] : rings);
      feat.infos.push(infos[i]);
    });
    feats.push(feat);
  }
  return feats;
}

function computeTarget(feats) {
  let maxA = 0;
  feats.forEach(f => f.infos.forEach(i => { if (i.area > maxA) maxA = i.area; }));
  let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
  feats.forEach(f => f.infos.forEach(i => {
    if (i.area >= maxA * 0.25) {
      minLat = Math.min(minLat, i.minLat); maxLat = Math.max(maxLat, i.maxLat);
      minLon = Math.min(minLon, i.minLon); maxLon = Math.max(maxLon, i.maxLon);
    }
  }));
  const lat = (minLat + maxLat) / 2, lon = (minLon + maxLon) / 2;
  const extent = Math.max(maxLat - minLat, (maxLon - minLon) * Math.cos(lat*D));
  return { lat, lon, range: clamp(extent * 111000 * 2.1, 4.5e5, 1.6e7) };
}

/* ------------------------------------------------------------------
   Globe
------------------------------------------------------------------- */
function col(h, a) {
  return new WW.Color(parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255, a == null ? 1 : a);
}
function mkAttrs(fill, line, w) {
  const a = new WW.ShapeAttributes(null);
  a.interiorColor = col(fill); a.outlineColor = col(line); a.outlineWidth = w;
  a.drawInterior = true; a.drawOutline = true;
  return a;
}

function setupGlobe(geo) {
  WW.Logger.setLoggingLevel(WW.Logger.LEVEL_WARNING);
  const wwd = new WW.WorldWindow('globe', new WW.ZeroElevationModel());
  state.wwd = wwd;
  try { { const sp = window.THEME.space.match(/\w\w/g).map(x => parseInt(x, 16) / 255); wwd.drawContext.clearColor = new WW.Color(sp[0], sp[1], sp[2], 1); } } catch (e) {}

  // Ocean: a single flat colour covering the whole sphere
  const oc = document.createElement('canvas'); oc.width = oc.height = 16;
  const ctx = oc.getContext('2d'); ctx.fillStyle = '#9fc5e0'; ctx.fillRect(0, 0, 16, 16);
  const oceanLayer = new WW.RenderableLayer('Ocean');
  oceanLayer.pickEnabled = false;
  oceanLayer.addRenderable(new WW.SurfaceImage(WW.Sector.FULL_SPHERE, oc.toDataURL()));
  wwd.addLayer(oceanLayer);

  POLITICAL = PALETTE.map(c => mkAttrs(c, '#6d7480', 1));
  GREY = mkAttrs('#dcdfe4', '#7b828c', 1);
  SELECTED = mkAttrs(window.THEME.fill, window.THEME.stroke, 3.5);

  const feats = buildFeatures(geo);
  state.feats = feats;
  const base = new WW.RenderableLayer('Countries'); base.pickEnabled = false;
  const hi = new WW.RenderableLayer('Selected');    hi.pickEnabled = false;
  [...feats].sort((a, b) => b.area - a.area).forEach(f => {
    f.bounds.forEach(b => {
      const s = new WW.SurfacePolygon(b, POLITICAL[f.colorIdx]);
      s.pathType = WW.LINEAR;
      f.shapes.push(s);
      base.addRenderable(s);
    });
  });
  const tapLayer = new WW.RenderableLayer('Tapped'); tapLayer.pickEnabled = false;
  wwd.addLayer(base); wwd.addLayer(hi); wwd.addLayer(tapLayer);
  state.base = base; state.hi = hi; state.tap = tapLayer;

  // Group selectable countries
  feats.forEach(f => {
    if (!f.iso) return;
    const c = state.countries[f.iso] || (state.countries[f.iso] = Object.assign({ feats: [] }, COUNTRIES[f.iso]));
    c.feats.push(f);
  });
  Object.values(state.countries).forEach(c => { c.target = computeTarget(c.feats); });

  const n = wwd.navigator;
  n.lookAtLocation.latitude = 20; n.lookAtLocation.longitude = 10; n.range = 2.4e7; n.heading = 0; n.tilt = 0;
  wwd.redraw();
}

function setGrey(on) {
  state.feats.forEach(f => {
    const a = on ? GREY : POLITICAL[f.colorIdx];
    f.shapes.forEach(s => { s.attributes = a; });
  });
}
function highlight(c) {
  state.hi.removeAllRenderables();
  c.feats.forEach(f => f.bounds.forEach(b => {
    const s = new WW.SurfacePolygon(b, SELECTED);
    s.pathType = WW.LINEAR;
    state.hi.addRenderable(s);
  }));
  setGrey(true);
  state.wwd.redraw();
}

/* ------------------------------------------------------------------
   Plane flight
------------------------------------------------------------------- */
const plane = $('#plane'), rot = $('#rot');
const setAngle = () => {};
const wait = ms => new Promise(r => setTimeout(r, ms));

async function fly(target, token) {
  const wwd = state.wwd, n = wwd.navigator;
  const from = { lat: n.lookAtLocation.latitude, lon: n.lookAtLocation.longitude, range: n.range };
  n.heading = 0; n.tilt = 0;
  const a = toVec(from.lat, from.lon), b = toVec(target.lat, target.lon);
  const omega = Math.acos(clamp(dot(a, b), -1, 1));
  const distM = omega * 6371000;

  if (distM < 2000) {                                  // already there
    plane.classList.remove('show');
    n.lookAtLocation.latitude = target.lat; n.lookAtLocation.longitude = target.lon; n.range = target.range;
    wwd.redraw();
    return true;
  }

  setAngle(bearing(from, target) - n.heading);
  plane.classList.add('show');                          // plane appears at the centre of the origin
  await wait(380);
  if (token !== state.sel) return false;

  const dur = clamp(2200 + distM / 1000 * 0.45, 2600, 7000);
  const lift = Math.min(distM * 0.9, 1.3e7);
  return new Promise(resolve => {
    let t0 = null;
    function frame(ts) {
      if (token !== state.sel) return resolve(false);
      if (t0 === null) t0 = ts;
      const t = clamp((ts - t0) / dur, 0, 1), e = ease(t);
      const p = fromVec(slerp(a, b, e, omega));
      const q = fromVec(slerp(a, b, Math.min(1, e + 0.01), omega));
      if (t < 1) setAngle(bearing(p, q) - n.heading);
      n.lookAtLocation.latitude = p.lat; n.lookAtLocation.longitude = p.lon;
      n.range = clamp(from.range + (target.range - from.range) * e + lift * Math.sin(Math.PI * t), 3e5, 2.4e7);
      wwd.redraw();
      if (t < 1) return requestAnimationFrame(frame);
      n.lookAtLocation.latitude = target.lat; n.lookAtLocation.longitude = target.lon; n.range = target.range;
      plane.classList.remove('show');                   // plane vanishes at the centre of the destination
      wwd.redraw();
      resolve(true);
    }
    requestAnimationFrame(frame);
  });
}

/* ---- reading aloud (the browser's built-in voice) ---- */
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices(); if (!vs.length) return;
  const rank = v => {
    const l = (v.lang || '').replace('_', '-'); let s;
    if (/^en-SG/i.test(l)) s = 6; else if (/^en-GB/i.test(l)) s = 5; else if (/^en-AU/i.test(l)) s = 4;
    else if (/^en-US/i.test(l)) s = 3; else if (/^en/i.test(l)) s = 2; else return -1;
    if (/female|samantha|karen|moira|serena|kate|martha|fiona|tessa|aria|jenny|libby|sonia|natural|google uk english female|google us english/i.test(v.name)) s += 3;
    if (/novelty|zarvox|bad news|bells|whisper|trinoids|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|albert|fred|junior|kathy|ralph/i.test(v.name)) s -= 10;
    return s;
  };
  const best = vs.map(v => ({ v, s: rank(v) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s)[0];
  voice = best ? best.v : null;
}
if (synth) {
  pickVoice();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); else synth.onvoiceschanged = pickVoice;
}
function say(text, done) {
  if (!synth) { if (done) done(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
  u.rate = 0.88; u.pitch = 1.1;
  if (done) { u.onend = done; u.onerror = done; }
  synth.speak(u);
}

async function renderInfo(c) {
  const wb = await Promise.race([state.wb, wait(1500).then(() => ({ area: {} }))]);
  if (state.cur !== c) return;
  const a = wb.area && wb.area[c.iso];
  const km2 = a ? a.v : c.feats.reduce((s, f) => s + f.area, 0) * 12392;
  const lvl = SIZES.find(s => km2 < s.max);
  const dots = [1, 2, 3, 4].map(n => '<i class="' + (n <= lvl.n ? 'on' : '') + '"></i>').join('');
  const list = (FACTS[c.iso] && FACTS[c.iso].length) ? FACTS[c.iso] : [c.name + ' is famous for ' + c.famous[0] + '.'];
  $('#info').innerHTML =
    '<div class="kc-head">' +
      '<div class="kc-mid"><div class="kc-namerow">' + flagImg(c.iso, 40, 'kc-flag-sm', '') + '<button class="kc-name" id="nameBtn">' + esc(c.name) + '</button></div>' +
      '<button class="size" id="sizeBtn" aria-label="How big"><span class="dots">' + dots + '</span><b>' + lvl.label + '</b></button></div>' +
      '</div>' +
    '<div class="facts" id="facts">' + list.map(f => '<div class="factcard">' + esc(f) + '</div>').join('') + '</div>' +
    (list.length > 1 ? '<div class="fdots" id="fdots">' + list.map((_, i) => '<i class="' + (i ? '' : 'on') + '"></i>').join('') + '</div>' : '');
  $('#nameBtn').addEventListener('click', () => say(c.name));
  $('#sizeBtn').addEventListener('click', () => say(c.name + ' is ' + lvl.label.toLowerCase() + '!'));
  const facts = $('#facts'); let idx = 0;
  facts.addEventListener('scroll', () => {
    const card = facts.firstElementChild, step = card.offsetWidth + 12;
    idx = clamp(Math.round(facts.scrollLeft / step), 0, list.length - 1);
    if (facts.scrollLeft + facts.clientWidth >= facts.scrollWidth - 2) idx = list.length - 1;
    document.querySelectorAll('#fdots i').forEach((d, i) => d.classList.toggle('on', i === idx));
  }, { passive: true });
  const first = facts.firstElementChild;
  if (first) { first.classList.add('hint'); setTimeout(() => first.classList.remove('hint'), 7000); }
  let talkingEl = null;
  facts.addEventListener('click', e => {                   // tap a fact card to hear it; tap again to stop
    const card = e.target.closest('.factcard'); if (!card) return;
    card.classList.remove('hint');
    if (talkingEl === card) { talkingEl = null; card.classList.remove('talking'); if (synth) synth.cancel(); return; }
    facts.querySelectorAll('.talking').forEach(x => x.classList.remove('talking'));
    talkingEl = card; card.classList.add('talking');
    const i = Array.prototype.indexOf.call(facts.children, card);
    say(list[i], () => { card.classList.remove('talking'); if (talkingEl === card) talkingEl = null; });
  });
}

/* ------------------------------------------------------------------
   Pictures (Wikimedia Commons) - only the named famous things, with safety filters
------------------------------------------------------------------- */
const G = { items: [], i: 0, timer: null };
const BAD = /\b(map|maps|flag|flags|coat of arms|emblem|logo|locator|location|stamp|diagram|poster|seal|banner|signature|chart|graph|icon|svg|pdf|screenshot|scan|document|postcard|coin|banknote|plan)\b/i;
const UNSAFE = /\b(nude|nudes|nudity|naked|erotic|erotica|sex|sexual|porn|topless|bikini|lingerie|underwear|fetish|bdsm|genital|breast|breasts|prostitute|brothel|strip|stripper|cigarette|smoking|alcohol|drunk|beer|wine|whisky|vodka|gun|rifle|weapon|bomb|corpse|murder|killed|massacre|genocide|blood|gore|skull|cemetery|funeral|execution)\b/i;
const UNSAFE_CAT = /nude|nudity|naked|erotic|sexual|porn|topless|bikini|lingerie|fetish|genital|prostitut|brothel|violence|corpse|gore|massacre|genocide|execution|torture|abuse|murder|dead people|war crime/i;
const CAMERA = /^(IMG|DSC|DSCF|DSCN|DCIM|PXL|MVIMG|_MG|P\d)[\s_-]?\d/i;

async function fetchSpec(spec, limit) {
  const base = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&uselang=en&generator=search&gsrnamespace=6' +
    '&prop=imageinfo%7Ccategories&iiprop=url%7Cmime%7Csize&iiurlwidth=960&cllimit=500';
  try {
    const r = await fetch(base + '&gsrlimit=' + limit + '&gsrsearch=' + encodeURIComponent(spec.q + ' -nude -naked -erotic filetype:bitmap'));
    const j = await r.json();
    return Object.values((j.query && j.query.pages) || {}).sort((x, y) => x.index - y.index).map(p => {
      const ii = p.imageinfo && p.imageinfo[0];
      if (!ii || !ii.thumburl || !/^image\/(jpeg|png)$/.test(ii.mime)) return null;
      if (ii.width < 700 || ii.height < 450) return null;
      const ar = ii.width / ii.height; if (ar < 0.6 || ar > 2.6) return null;
      if (BAD.test(p.title) || UNSAFE.test(p.title)) return null;
      if ((p.categories || []).some(x => UNSAFE_CAT.test(x.title))) return null;
      let cap = p.title.replace(/^File:/, '').replace(/\.[a-z0-9]+$/i, '').replace(/_/g, ' ').trim();
      if (spec.tag) cap = spec.tag; else if (CAMERA.test(cap)) cap = '';
      return { title: p.title, url: ii.thumburl, page: ii.descriptionurl, cap, tag: spec.tag };
    }).filter(Boolean);
  } catch (e) { return []; }
}
function interleave(lists, max) {
  const out = [], seen = new Set();
  let k = 0, more = true;
  while (out.length < max && more) {
    more = false;
    for (const list of lists) {
      if (k < list.length) {
        more = true;
        const it = list[k];
        if (!seen.has(it.title)) { seen.add(it.title); out.push(it); if (out.length >= max) break; }
      }
    }
    k++;
  }
  return out;
}
async function fetchImages(c) {
  const lists = await Promise.all(c.famous.map(f => fetchSpec({ q: f + ' ' + c.name, tag: f }, 10)));
  let out = interleave(lists, 28);
  if (out.length < 6) {                                   // rare: a country with few results
    const extra = await fetchSpec({ q: c.name + ' landmark', tag: null }, 15);
    out = interleave([out, extra], 28);
  }
  return out;
}

const mainImg = $('#main'), msg = $('#viewerMsg'), prevB = $('#prev'), nextB = $('#next'),
      countEl = $('#count'), capText = $('#capText'), capLink = $('#capLink'), thumbs = $('#thumbs'),
      playBtn = $('#playBtn');
const thumbUrl = u => u.replace(/\/960px-/, '/250px-');

function stopSlides() { clearInterval(G.timer); G.timer = null; playBtn.textContent = '▶'; }
function toggleSlides() {
  if (G.timer) return stopSlides();
  playBtn.textContent = '⏸';
  G.timer = setInterval(() => show(G.i + 1), 5000);
}
function galleryMessage(text) {
  stopSlides();
  G.items = []; thumbs.innerHTML = '';
  mainImg.hidden = prevB.hidden = nextB.hidden = countEl.hidden = capLink.hidden = playBtn.hidden = true;
  msg.hidden = false; msg.textContent = text; capText.innerHTML = '&nbsp;';
}
function setGallery(items) {
  stopSlides();
  G.items = items; G.i = 0;
  if (!items.length) return galleryMessage('No pictures found for this place.');
  msg.hidden = true; thumbs.innerHTML = '';
  items.forEach((it, idx) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Picture ' + (idx + 1));
    const im = document.createElement('img');
    im.loading = 'lazy'; im.alt = ''; im.src = thumbUrl(it.url);
    im.onerror = () => { if (im.src !== it.url) im.src = it.url; };
    b.appendChild(im); b.addEventListener('click', () => { stopSlides(); show(idx); });
    thumbs.appendChild(b);
  });
  show(0);
}
function show(i) {
  const n = G.items.length; if (!n) return;
  G.i = (i + n) % n;
  const it = G.items[G.i], multi = n > 1;
  mainImg.hidden = false; mainImg.src = it.url; mainImg.alt = it.cap;
  prevB.hidden = nextB.hidden = playBtn.hidden = !multi; countEl.hidden = false;
  countEl.textContent = (G.i + 1) + ' / ' + n;
  capText.textContent = it.cap || ' '; capText.title = it.cap;
  capLink.href = it.page; capLink.hidden = false;
  [...thumbs.children].forEach((b, idx) => b.classList.toggle('on', idx === G.i));
  const on = thumbs.children[G.i];
  if (on) thumbs.scrollLeft = on.offsetLeft - (thumbs.clientWidth - on.clientWidth) / 2;
  if (multi) { const nx = new Image(); nx.src = G.items[(G.i + 1) % n].url; }
  if (lb.classList.contains('open')) lbUpdate();
}
mainImg.addEventListener('error', () => {
  if (!G.items.length) return;
  G.items.splice(G.i, 1);
  setGallery(G.items.slice());
});
prevB.addEventListener('click', () => { stopSlides(); show(G.i - 1); });
nextB.addEventListener('click', () => { stopSlides(); show(G.i + 1); });
playBtn.addEventListener('click', toggleSlides);

function lbUpdate() {

}
function wireNorth() {
  const b = $('#north'); if (!b) return;
  const needle = $('#needle'); let last = null;
  (function spin() {                                       // the needle always points to north
    const h = state.wwd && state.wwd.navigator ? state.wwd.navigator.heading : 0;
    if (h !== last) { last = h; needle.style.transform = 'rotate(' + (-h) + 'deg)'; }
    requestAnimationFrame(spin);
  })();
  b.addEventListener('pointerdown', e => e.stopPropagation());
  b.addEventListener('click', () => {
    const nav = state.wwd.navigator, h0 = ((nav.heading + 540) % 360) - 180, t0 = nav.tilt, t = Date.now();
    (function step() {
      const k = Math.min(1, (Date.now() - t) / 450), e = 1 - Math.pow(1 - k, 3);
      nav.heading = h0 * (1 - e); nav.tilt = t0 * (1 - e);
      state.wwd.redraw();
      if (k < 1) requestAnimationFrame(step);
    })();
  });
}
function wireMapTaps() {
  const cv = $('#globe'), pts = new Set();
  let down = null;
  cv.addEventListener('pointerdown', e => {
    pts.add(e.pointerId);
    down = pts.size === 1 ? { x: e.clientX, y: e.clientY, t: Date.now() } : null;
  });
  cv.addEventListener('pointerup', e => {
    const d = down; pts.delete(e.pointerId); down = null;
    if (d && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8 && Date.now() - d.t < 450) onMapTap(e.clientX, e.clientY);
  });
  cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); down = null; });
}

/* ------------------------------------------------------------------
   Start
------------------------------------------------------------------- */
(async function init() {
  const loadingText = $('#loadingText');
  try {
    state.wb = wbFetch('AG.LND.TOTL.K2').then(a => ({ area: a }));
    const [, geo] = await Promise.all([loadScript(WW_URLS), fetchGeo()]);
    WW = window.WorldWind;
    setupGlobe(geo);
    buildEntries();
    {                                                      // exactly 25 valid, different favourites; random ones fill any gaps
      const ok = FAVOURITES.filter((i, k, a) => state.countries[i] && a.indexOf(i) === k).slice(0, 25);
      const pool = shuffle(Object.keys(state.countries).filter(i => !ok.includes(i)));
      while (ok.length < 25 && pool.length) ok.push(pool.pop());
      FAVOURITES = ok;
    }
    buildShelf();
    wireMapTaps();
    wireNorth();
    $('#loading').classList.add('hide');
  } catch (err) {
    console.error(err);
    $('.spinner').style.display = 'none';
    loadingText.textContent = 'Sorry, the globe could not be loaded (' + err.message + '). Please check the internet connection and reload.';
  }
})();
})();

</script>
